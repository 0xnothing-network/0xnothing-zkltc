# Runs the checks that guard what the three hosts deploy from main. Nothing here
# needs a secret: the tests use no network and no .env file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 0xNothing-zkLTC-Testnet/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 0xNothing-zkLTC-Testnet/apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Repository tooling tests
        working-directory: .
        run: npm run test:tooling

  wallet:
    name: Wallet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            0xNothing-zkLTC-Testnet/apps/wallet/package-lock.json
            0xNothing-zkLTC-Testnet/apps/web/package-lock.json
      # The wallet tests share the web app's test helper, which loads typescript
      # from the web app's own node_modules.
      - run: npm ci --ignore-scripts
        working-directory: 0xNothing-zkLTC-Testnet/apps/web
      - run: npm ci
        working-directory: 0xNothing-zkLTC-Testnet/apps/wallet
      - run: npm test
        working-directory: 0xNothing-zkLTC-Testnet/apps/wallet
      - run: npm run typecheck
        working-directory: 0xNothing-zkLTC-Testnet/apps/wallet
      - run: npm run build
        working-directory: 0xNothing-zkLTC-Testnet/apps/wallet
