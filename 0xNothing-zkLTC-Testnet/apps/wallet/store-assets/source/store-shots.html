<!doctype html>
<!--
  0xWallet store images: the layout behind the Chrome Web Store screenshots, promo
  tiles and contact sheets. make-shots.mjs (COMPOSE=1) opens this file in Playwright,
  sets the viewport to the exact output size and calls window.render(spec).
  Colours, fonts and the frame shadow come from the wallet itself: index.html (html
  background), src/styles/tokens.css, public/fonts, public/icons.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>0xWallet store images</title>
<style>
  @font-face {
    font-family: "Geist";
    src: url("../../public/fonts/Geist-latin.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Geist";
    src: url("../../public/fonts/Geist-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Geist";
    src: url("../../public/fonts/Geist-vietnamese.woff2") format("woff2");
    font-weight: 100 900;
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  @font-face {
    font-family: "Departure Mono";
    src: url("../../public/fonts/DepartureMono-Regular.woff2") format("woff2");
    font-weight: 400;
  }

  /* Values from src/styles/tokens.css (dark) and the html background in index.html. */
  :root {
    --bg: #0b0c0e;
    --surface-1: #111316;
    --line: #23272d;
    --line-strong: #2f353c;
    --text-1: #f2f4f6;
    --text-2: #a9b0b9;
    --text-3: #7d8590;
    /* The one accent: the product's live-network green (--positive), as on the
       "LitVM LiteForge" pill in the wallet header. */
    --accent: #3dd68c;
    --edge-highlight: inset 0 1px 0 rgba(238, 241, 244, .06);
    --e-2: var(--edge-highlight), 0 12px 32px -12px rgba(0, 0, 0, .65), 0 0 0 1px var(--line);
    --r-lg: 14px;
    --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-brand: "Departure Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text-1); }
  body { font-family: var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .canvas { position: relative; background: var(--bg); overflow: hidden; }

  /* Corner marks */
  .mark { position: absolute; display: flex; align-items: center; gap: 12px; }
  .mark img { display: block; border-radius: 50%; box-shadow: 0 0 0 1px var(--line-strong); }
  .mark span { font-weight: 600; letter-spacing: -.01em; color: var(--text-1); }
  .net { position: absolute; display: flex; align-items: center; gap: 10px;
         font-family: var(--font-brand); color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .net i { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  /* The capture frame: the popup as drawn, with the product's own --e-2 elevation. */
  .shot { position: absolute; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--e-2); background: var(--bg); }
  .shot img { display: block; width: 100%; height: 100%; }
  .shot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--line-strong); pointer-events: none; }

  /* Copy */
  .copy { position: absolute; }
  .kicker { font-family: var(--font-brand); color: var(--text-3); letter-spacing: .04em; }
  .kicker b { font-weight: 400; color: var(--accent); }
  h1 { margin: 0; font-weight: 600; letter-spacing: -.028em; color: var(--text-1); text-wrap: balance; }
  p { margin: 0; color: var(--text-2); text-wrap: pretty; }

  /* Contact sheet */
  .cell { position: absolute; }
  .cell img { display: block; width: 100%; border-radius: 6px; box-shadow: 0 0 0 1px var(--line-strong); }
  .cell span { display: block; margin-top: 10px; font-family: var(--font-brand); font-size: 12px; color: var(--text-3); letter-spacing: .04em; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Every coordinate below sits on an 8 px grid unless it is derived from a capture size.
  const ICON = "../../public/icons/icon-192.png";
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "style") Object.assign(n.style, v); else if (k === "html") n.innerHTML = v; else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const px = (o) => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === "number" ? `${v}px` : v]));
  const mark = (x, y, size, font) => el("div", { class: "mark", style: px({ left: x, top: y }) },
    el("img", { src: ICON, width: String(size), height: String(size) }),
    el("span", { style: px({ fontSize: font }) }, "0xWallet"));
  const net = (x, bottom, font, label) => el("div", { class: "net", style: px({ left: x, bottom, fontSize: font }) },
    el("i"), label);
  const shot = (src, x, y, w, h) => el("div", { class: "shot", style: px({ left: x, top: y, width: w, height: h }) },
    el("img", { src, alt: "" }));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const LAYOUTS = {
    // 1280x800 store screenshot: copy on the left, one 360x600 capture on the right.
    screenshot(s) {
      const W = 1280, H = 800, M = 96;
      const w = Math.round(360 * s.scale), h = Math.round(600 * s.scale);
      const x = W - M - w, y = Math.round((H - h) / 2);
      const c = el("div", { class: "canvas", style: px({ width: W, height: H }) });
      c.append(mark(M, y, 32, 20));
      c.append(net(M, y, 13, s.network));
      const copy = el("div", { class: "copy", style: px({ left: M, top: 0, width: x - M - 96, height: H, display: "flex", flexDirection: "column", justifyContent: "center" }) },
        el("div", { class: "kicker", style: px({ fontSize: 14, marginBottom: 24 }), html: `<b>${esc(s.index)}</b> / ${esc(s.total)}` }),
        el("h1", { style: px({ fontSize: 56, lineHeight: "64px" }) }, s.headline),
        el("p", { style: px({ fontSize: 22, lineHeight: "32px", marginTop: 24, maxWidth: 480 }) }, s.line));
      c.append(copy);
      c.append(shot(s.capture, x, y, w, h));
      return c;
    },
    // 440x280 small promo tile: brand only, read at a small size.
    small(s) {
      const W = 440, H = 280, M = 32;
      const c = el("div", { class: "canvas", style: px({ width: W, height: H }) });
      c.append(el("div", { class: "copy", style: px({ left: M, top: 0, width: W - 2 * M, height: H - 40, display: "flex", flexDirection: "column", justifyContent: "center" }) },
        el("div", { style: px({ display: "flex", alignItems: "center", gap: 16 }) },
          el("img", { src: ICON, width: "56", height: "56", style: { borderRadius: "50%", display: "block" } }),
          el("h1", { style: px({ fontSize: 44, lineHeight: "48px" }) }, "0xWallet")),
        el("p", { style: px({ fontSize: 18, lineHeight: "24px", marginTop: 16 }) }, s.line)));
      c.append(net(M, M, 12, s.network));
      return c;
    },
    // 1400x560 marquee: copy on the left, two captures on the right.
    marquee(s) {
      const W = 1400, H = 560, M = 96, GAP = 32;
      const w = Math.round(360 * s.scale), h = Math.round(600 * s.scale);
      const y = Math.round((H - h) / 2);
      const c = el("div", { class: "canvas", style: px({ width: W, height: H }) });
      c.append(mark(M, y, 32, 20));
      c.append(net(M, y, 13, s.network));
      const left = W - M - s.captures.length * w - (s.captures.length - 1) * GAP;
      c.append(el("div", { class: "copy", style: px({ left: M, top: 0, width: left - M - 96, height: H, display: "flex", flexDirection: "column", justifyContent: "center" }) },
        el("h1", { style: px({ fontSize: 56, lineHeight: "64px" }) }, s.headline),
        el("p", { style: px({ fontSize: 22, lineHeight: "32px", marginTop: 24, maxWidth: 520 }) }, s.line)));
      s.captures.forEach((src, i) => c.append(shot(src, left + i * (w + GAP), y, w, h)));
      return c;
    },
    // Contact sheet: finished images scaled down in a grid, file name under each.
    sheet(s) {
      const P = 32, LABEL = 28;
      const rows = Math.ceil(s.items.length / s.cols);
      const W = s.width, cw = s.cellWidth;
      const H = P + rows * (s.cellHeight + LABEL + P);
      const c = el("div", { class: "canvas", style: px({ width: W, height: H }) });
      let x = P, y = P, rowH = 0;
      s.items.forEach((it, i) => {
        if (i && i % s.cols === 0) { x = P; y += rowH + LABEL + P; rowH = 0; }
        const w = it.width ?? cw;
        const h = Math.round(w * it.h / it.w);
        c.append(el("div", { class: "cell", style: px({ left: x, top: y, width: w }) }, el("img", { src: it.src }), el("span", {}, it.label)));
        x += w + P;
        rowH = Math.max(rowH, h);
      });
      return c;
    },
  };

  window.render = async (spec) => {
    document.documentElement.lang = spec.lang ?? "en";
    const root = document.getElementById("root");
    root.replaceChildren(LAYOUTS[spec.layout](spec));
    await document.fonts.ready;
    await Promise.all([...document.images].map((i) => i.decode().catch(() => { throw new Error(`image failed: ${i.src}`); })));
    const fonts = [...document.fonts].filter((f) => f.status === "loaded").map((f) => f.family);
    return { fonts: [...new Set(fonts)] };
  };
</script>
</body>
</html>
