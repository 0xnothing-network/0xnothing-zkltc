specVersion: 1.0.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: ZeroXFiFactory
    network: liteforge
    source:
      address: "0xc3B99e993eBAF776BFF01fa8a019Fe6d4334de52"
      abi: ZeroXFiFactory
      startBlock: 60287622
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities: [Protocol, Token, Pool]
      abis:
        - name: ZeroXFiFactory
          file: ./abis/ZeroXFiFactory.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,indexed bytes32,bool,uint256)
          handler: handlePairCreated
  - kind: ethereum
    name: GaugeFactory
    network: liteforge
    source:
      address: "0x6a9aA46d15757351eC12A8B97b48C4Ebc6CAa1f5"
      abi: GaugeFactory
      startBlock: 60287622
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/gaugeFactory.ts
      entities: [Protocol, Gauge, GaugeAction]
      abis:
        - name: GaugeFactory
          file: ./abis/GaugeFactory.json
      eventHandlers:
        - event: GaugeCreated(indexed address,indexed address,uint256)
          handler: handleGaugeCreated
        - event: GaugeFunded(indexed address,indexed address,uint256,uint256)
          handler: handleGaugeFunded
  - kind: ethereum
    name: NbtcVault
    network: liteforge
    source:
      address: "0xba9f9c4C9d260fC93C2449Dd66Ad1C5Ada23536E"
      abi: SyntheticVault
      startBlock: 60287622
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/syntheticVault.ts
      entities: [SyntheticMarket, SyntheticAction]
      abis:
        - name: SyntheticVault
          file: ./abis/SyntheticVault.json
        - name: ERC20
          file: ./abis/ERC20.json
      blockHandlers:
        - handler: handleInitialize
          filter:
            kind: once
      eventHandlers:
        - event: CollateralDeposited(indexed address,indexed address,uint256)
          handler: handleCollateralDeposited
        - event: ReserveCollateralAllocated(indexed address,uint256)
          handler: handleReserveCollateralAllocated
        - event: ReserveCollateralReleased(indexed address,uint256)
          handler: handleReserveCollateralReleased
        - event: ReserveCollateralLost(indexed address,uint256)
          handler: handleReserveCollateralLost
        - event: SyntheticMinted(indexed address,indexed address,uint256,uint256)
          handler: handleSyntheticMinted
        - event: SyntheticRepaid(indexed address,indexed address,uint256,uint256)
          handler: handleSyntheticRepaid
        - event: CollateralWithdrawn(indexed address,indexed address,uint256)
          handler: handleCollateralWithdrawn
        - event: PositionLiquidated(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handlePositionLiquidated
        - event: BadDebtRecognized(indexed address,uint256)
          handler: handleBadDebtRecognized
        - event: BadDebtCovered(indexed address,indexed address,uint256)
          handler: handleBadDebtCovered
        - event: DebtCeilingUpdated(uint256,uint256)
          handler: handleDebtCeilingUpdated
        - event: MintPauseUpdated(bool)
          handler: handleMintPauseUpdated
        - event: WithdrawPauseUpdated(bool)
          handler: handleWithdrawPauseUpdated
  - kind: ethereum
    name: NethVault
    network: liteforge
    source:
      address: "0xb33a0bA988B5E4c3a23875b5614083685586Bb2B"
      abi: SyntheticVault
      startBlock: 60287622
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/syntheticVault.ts
      entities: [SyntheticMarket, SyntheticAction]
      abis:
        - name: SyntheticVault
          file: ./abis/SyntheticVault.json
        - name: ERC20
          file: ./abis/ERC20.json
      blockHandlers:
        - handler: handleInitialize
          filter:
            kind: once
      eventHandlers:
        - event: CollateralDeposited(indexed address,indexed address,uint256)
          handler: handleCollateralDeposited
        - event: ReserveCollateralAllocated(indexed address,uint256)
          handler: handleReserveCollateralAllocated
        - event: ReserveCollateralReleased(indexed address,uint256)
          handler: handleReserveCollateralReleased
        - event: ReserveCollateralLost(indexed address,uint256)
          handler: handleReserveCollateralLost
        - event: SyntheticMinted(indexed address,indexed address,uint256,uint256)
          handler: handleSyntheticMinted
        - event: SyntheticRepaid(indexed address,indexed address,uint256,uint256)
          handler: handleSyntheticRepaid
        - event: CollateralWithdrawn(indexed address,indexed address,uint256)
          handler: handleCollateralWithdrawn
        - event: PositionLiquidated(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handlePositionLiquidated
        - event: BadDebtRecognized(indexed address,uint256)
          handler: handleBadDebtRecognized
        - event: BadDebtCovered(indexed address,indexed address,uint256)
          handler: handleBadDebtCovered
        - event: DebtCeilingUpdated(uint256,uint256)
          handler: handleDebtCeilingUpdated
        - event: MintPauseUpdated(bool)
          handler: handleMintPauseUpdated
        - event: WithdrawPauseUpdated(bool)
          handler: handleWithdrawPauseUpdated
  - kind: ethereum
    name: LendingPool
    network: liteforge
    source:
      address: "0x34ACc957ef5BACEE97b9056BE2C5A910eE7022b8"
      abi: LendingPool
      startBlock: 60287622
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/lending.ts
      entities: [LendingMarket, LendingAction]
      abis:
        - name: LendingPool
          file: ./abis/LendingPool.json
      blockHandlers:
        - handler: handleInitialize
          filter:
            kind: once
      eventHandlers:
        - event: InterestAccrued(uint256,uint256,uint256)
          handler: handleInterestAccrued
        - event: Supplied(indexed address,indexed address,uint256,uint256)
          handler: handleSupplied
        - event: Withdrawn(indexed address,indexed address,uint256,uint256)
          handler: handleWithdrawn
        - event: CollateralDeposited(indexed address,indexed address,indexed address,uint256)
          handler: handleCollateralDeposited
        - event: CollateralWithdrawn(indexed address,indexed address,indexed address,uint256)
          handler: handleCollateralWithdrawn
        - event: Borrowed(indexed address,indexed address,uint256,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed address,indexed address,uint256,uint256)
          handler: handleRepaid
        - event: Liquidated(indexed address,indexed address,indexed address,uint256,uint256,address)
          handler: handleLiquidated
        - event: BadDebtRecognized(indexed address,uint256)
          handler: handleBadDebtRecognized
        - event: BadDebtRepaid(indexed address,indexed address,uint256)
          handler: handleBadDebtRepaid
        - event: CapsUpdated(uint256,uint256)
          handler: handleCapsUpdated
        - event: PausesUpdated(bool,bool,bool)
          handler: handlePausesUpdated
templates:
  - kind: ethereum/contract
    name: Pair
    network: liteforge
    source:
      abi: Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/pair.ts
      entities: [Protocol, Pool, Swap, LiquidityEvent, Candle]
      abis:
        - name: Pair
          file: ./abis/Pair.json
      eventHandlers:
        - event: Sync(uint112,uint112)
          handler: handleSync
        - event: Mint(indexed address,uint256,uint256,indexed address,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,indexed address,uint256)
          handler: handleBurn
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: BootstrapCompleted(indexed address)
          handler: handleBootstrapCompleted
  - kind: ethereum/contract
    name: LiquidityGauge
    network: liteforge
    source:
      abi: LiquidityGauge
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/gauge.ts
      entities: [Gauge, GaugeAction]
      abis:
        - name: LiquidityGauge
          file: ./abis/LiquidityGauge.json
      eventHandlers:
        - event: Staked(indexed address,uint256)
          handler: handleStaked
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
        - event: RewardPaid(indexed address,uint256)
          handler: handleRewardPaid
        - event: RewardAdded(uint256,uint256,uint256,uint256)
          handler: handleRewardAdded
        - event: RewardSchedulePaused(uint256)
          handler: handleRewardSchedulePaused
        - event: RewardScheduleResumed(uint256)
          handler: handleRewardScheduleResumed
        - event: DepositsPauseUpdated(bool)
          handler: handleDepositsPauseUpdated
