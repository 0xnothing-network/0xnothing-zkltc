specVersion: 0.0.5
description: 0xPixel NUSD NFT marketplace history on LiteForge (chain 4441). Native-zkLTC trades are indexed separately and never merged here.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NusdNftMarketplace
    network: liteforge
    source:
      address: "0xA5e3EDfcba3b6fc40f3e41557f8a303a2AAC7e09"
      abi: NusdNftMarketplace
      startBlock: 60811596
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - NusdListing
        - NusdOffer
        - NusdActivity
        - NusdMarketStats
      abis:
        - name: NusdNftMarketplace
          file: ./abis/NusdNftMarketplace.json
      eventHandlers:
        - event: Listed(indexed uint256,indexed address,indexed uint256,address,uint256)
          handler: handleListed
        - event: ListingPriceUpdated(indexed uint256,uint256)
          handler: handleListingPriceUpdated
        - event: ListingCancelled(indexed uint256)
          handler: handleListingCancelled
        - event: ListingInvalidated(indexed uint256)
          handler: handleListingInvalidated
        - event: Bought(indexed uint256,indexed address,uint256)
          handler: handleBought
        - event: SaleSettled(indexed address,indexed address,indexed address,uint256,uint256,uint256,address,uint256)
          handler: handleSaleSettled
        - event: OfferCreated(indexed uint256,indexed address,indexed uint256,address,uint256,uint64)
          handler: handleOfferCreated
        - event: OfferCancelled(indexed uint256,indexed address,uint256)
          handler: handleOfferCancelled
        - event: OfferAccepted(indexed uint256,indexed address,indexed address,uint256)
          handler: handleOfferAccepted
  - kind: ethereum
    name: PixelNFT
    network: liteforge
    source:
      address: "0x33A32b9b2BEe864f9e42BFa39cA7BDC72f655988"
      abi: ERC721
      startBlock: 60811596
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - NusdActivity
      abis:
        - name: ERC721
          file: ./abis/ERC721.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
  - kind: ethereum
    name: PixelNFTV2
    network: liteforge
    source:
      address: "0xd83cb7acef921f98b6b983cbb712a583869da9eb"
      abi: ERC721
      startBlock: 60811596
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - NusdActivity
      abis:
        - name: ERC721
          file: ./abis/ERC721.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
