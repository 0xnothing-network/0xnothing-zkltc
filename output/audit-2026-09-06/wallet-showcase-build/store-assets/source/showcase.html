<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0xWallet Chrome Web Store assets</title>
    <style>
      @font-face {
        font-family: "Departure Mono";
        src: url("/fonts/DepartureMono-Regular.woff2") format("woff2");
        font-display: block;
      }

      :root {
        --bg: #050806;
        --panel: #0a100c;
        --panel-2: #101812;
        --input: #060a07;
        --line: rgba(177, 232, 201, 0.14);
        --line-strong: rgba(177, 232, 201, 0.32);
        --text: #edf5f0;
        --muted: #8d9c94;
        --dim: #59665f;
        --green: #8ee9b8;
        --green-hover: #b5f0ce;
        --red: #ff8f9f;
        --yellow: #d8c98d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Departure Mono", Consolas, monospace;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      .artboard {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
        background-color: #050806;
      }

      .artboard::before {
        position: absolute;
        inset: 0;
        z-index: -2;
        content: "";
        background-image:
          linear-gradient(rgba(142, 233, 184, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(142, 233, 184, 0.035) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .artboard::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        background:
          linear-gradient(90deg, rgba(5, 8, 6, 0.12), rgba(5, 8, 6, 0.72)),
          linear-gradient(180deg, transparent 76%, rgba(142, 233, 184, 0.035));
      }

      .store-shot {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 500px;
        gap: 72px;
        align-items: center;
        padding: 70px 92px;
      }

      .copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 64px;
      }

      .brand-logo {
        width: 70px;
        height: 70px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        object-fit: cover;
      }

      .brand-name {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .brand-name strong {
        color: var(--text);
        font-size: 19px;
        font-weight: 400;
        letter-spacing: 0.05em;
      }

      .brand-name span,
      .eyebrow,
      .screen-index,
      .chip {
        color: var(--green);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin-bottom: 20px;
      }

      h1 {
        max-width: 650px;
        margin: 0;
        color: var(--text);
        font-size: 52px;
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.07;
        text-transform: uppercase;
      }

      .subcopy {
        max-width: 595px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 34px;
      }

      .chip {
        padding: 9px 11px;
        border: 1px solid var(--line-strong);
        color: var(--muted);
        letter-spacing: 0.09em;
      }

      .screen-index {
        position: absolute;
        bottom: 42px;
        left: 92px;
        color: var(--dim);
      }

      .device-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 500px;
        height: 660px;
      }

      .device-wrap::before,
      .device-wrap::after {
        position: absolute;
        content: "";
        border-color: rgba(142, 233, 184, 0.26);
      }

      .device-wrap::before {
        inset: 10px 24px;
        border-top: 1px solid;
        border-bottom: 1px solid;
      }

      .device-wrap::after {
        inset: 34px 0;
        border-right: 1px solid;
        border-left: 1px solid;
      }

      .wallet {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        width: 360px;
        height: 600px;
        overflow: hidden;
        border: 1px solid rgba(142, 233, 184, 0.45);
        background: var(--bg);
        box-shadow: 18px 18px 0 rgba(142, 233, 184, 0.055);
        color: var(--text);
        font-size: 12px;
        line-height: 1.45;
      }

      .w-head {
        display: flex;
        min-height: 60px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 13px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }

      .w-head-copy {
        min-width: 0;
      }

      .w-head-title {
        display: block;
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .w-address {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }

      .icon-btn,
      .mini-btn {
        display: inline-grid;
        place-items: center;
        min-width: 34px;
        min-height: 34px;
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--text);
      }

      .w-body {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }

      .total {
        padding: 17px 13px 14px;
        border-bottom: 1px solid var(--line);
      }

      .total-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .total-value {
        color: var(--text);
        font-size: 30px;
        line-height: 1;
      }

      .delta {
        color: var(--green);
        font-size: 10px;
      }

      .total-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 15px;
      }

      .label {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .primary {
        border: 1px solid var(--green);
        background: var(--green);
        color: #050806;
      }

      .mint {
        min-height: 31px;
        padding: 0 14px;
        font-size: 10px;
        text-transform: uppercase;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border-bottom: 1px solid var(--line);
      }

      .action {
        display: flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 4px;
        border-right: 1px solid var(--line);
        color: var(--text);
        font-size: 9px;
        text-transform: uppercase;
      }

      .action:last-child {
        border-right: 0;
      }

      .action b {
        color: var(--green);
        font-size: 16px;
        font-weight: 400;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        min-height: 38px;
        border-bottom: 1px solid var(--line);
      }

      .tab {
        display: grid;
        position: relative;
        place-items: center;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
      }

      .tab.active {
        color: var(--text);
      }

      .tab.active::after {
        position: absolute;
        right: 0;
        bottom: -1px;
        left: 0;
        height: 2px;
        content: "";
        background: var(--green);
      }

      .assets {
        display: flex;
        flex-direction: column;
      }

      .asset {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: center;
        min-height: 55px;
        padding: 7px 13px;
        border-bottom: 1px solid var(--line);
      }

      .asset-logo {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        object-fit: cover;
      }

      .asset-name,
      .asset-value {
        color: var(--text);
        font-size: 11px;
      }

      .asset-sub,
      .asset-usd {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 9px;
      }

      .asset-value,
      .asset-usd {
        text-align: right;
      }

      .verified {
        color: var(--green);
      }

      .core {
        margin-left: 5px;
        padding: 1px 4px;
        border: 1px solid rgba(142, 233, 184, 0.45);
        color: var(--green);
        font-size: 7px;
      }

      .nav {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        min-height: 52px;
        margin-top: auto;
        border-top: 1px solid var(--line-strong);
      }

      .nav-item {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 3px;
        border-right: 1px solid var(--line);
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
      }

      .nav-item:last-child {
        border-right: 0;
      }

      .nav-item.active {
        border-top: 1px solid var(--green);
        color: var(--green);
      }

      .flow {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 13px;
        padding: 14px 13px;
      }

      .field-label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .token-card,
      .input-box,
      .panel,
      .summary,
      .network-card {
        border: 1px solid var(--line-strong);
        background: var(--input);
      }

      .token-card {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        min-height: 55px;
        padding: 9px 11px;
      }

      .token-card img {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        object-fit: cover;
      }

      .token-card strong {
        display: block;
        font-size: 11px;
        font-weight: 400;
      }

      .token-card span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 9px;
      }

      .swap-arrow {
        align-self: flex-end;
        margin: -7px 7px -7px 0;
      }

      .input-box {
        display: flex;
        min-height: 51px;
        align-items: center;
        justify-content: space-between;
        padding: 0 11px;
      }

      .input-box strong {
        color: var(--text);
        font-size: 20px;
        font-weight: 400;
      }

      .input-box span {
        color: var(--green);
        font-size: 10px;
      }

      .route-panel {
        display: grid;
        grid-template-columns: 1fr auto;
        row-gap: 8px;
        padding: 10px 11px;
        border: 1px solid var(--line);
      }

      .route-panel dt,
      .route-panel dd {
        margin: 0;
        font-size: 9px;
      }

      .route-panel dt {
        color: var(--muted);
        text-transform: uppercase;
      }

      .route-panel dd {
        color: var(--text);
        text-align: right;
      }

      .catalog {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        border: 1px solid var(--line-strong);
      }

      .search {
        min-height: 42px;
        padding: 0 11px;
        border: 0;
        border-bottom: 1px solid var(--line-strong);
        outline: 0;
        background: var(--input);
        color: var(--text);
      }

      .token-option {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: center;
        min-height: 52px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
      }

      .token-option:last-child {
        border-bottom: 0;
      }

      .token-option img {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
      }

      .token-option strong,
      .token-option small {
        display: block;
        font-weight: 400;
      }

      .token-option strong {
        font-size: 10px;
      }

      .token-option small {
        margin-top: 2px;
        color: var(--muted);
        font-size: 8px;
      }

      .source {
        padding: 3px 5px;
        border: 1px solid var(--line-strong);
        color: var(--green);
        font-size: 7px;
        text-transform: uppercase;
      }

      .block-btn {
        display: grid;
        min-height: 42px;
        place-items: center;
        width: 100%;
        border: 1px solid var(--green);
        background: var(--green);
        color: #050806;
        font-size: 10px;
        text-transform: uppercase;
      }

      .review-hero {
        margin: 14px 13px 0;
        padding: 16px 13px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
      }

      .review-hero strong {
        display: block;
        margin-top: 7px;
        color: var(--text);
        font-size: 23px;
        font-weight: 400;
      }

      .review-hero small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 9px;
      }

      .summary {
        display: grid;
        grid-template-columns: 1fr auto;
        margin: 12px 13px 0;
      }

      .summary span {
        min-height: 38px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        font-size: 9px;
      }

      .summary span:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .summary span:nth-child(odd) {
        color: var(--muted);
        text-transform: uppercase;
      }

      .summary span:nth-child(even) {
        color: var(--text);
        text-align: right;
      }

      .notice {
        margin: 12px 13px 0;
        padding: 11px;
        border: 1px solid rgba(216, 201, 141, 0.42);
        color: var(--yellow);
        font-size: 9px;
        line-height: 1.5;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1.45fr;
        gap: 9px;
        margin: auto 13px 13px;
      }

      .button-row button {
        min-height: 43px;
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--text);
        font-size: 9px;
        text-transform: uppercase;
      }

      .button-row button:last-child {
        border-color: var(--green);
        background: var(--green);
        color: #050806;
      }

      .receive-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 12px;
        padding: 14px 13px;
      }

      .receive-card {
        display: flex;
        align-items: center;
        flex-direction: column;
        padding: 18px 12px 15px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
      }

      .qr-frame {
        display: grid;
        width: 218px;
        height: 218px;
        place-items: center;
        border: 1px solid var(--line-strong);
        background: #ffffff;
      }

      .qr-frame img {
        width: 208px;
        height: 208px;
      }

      .network {
        margin-top: 12px;
        color: var(--green);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .address-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 22px;
        margin-top: 10px;
        color: var(--text);
        font-size: 10px;
      }

      .receive-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .receive-actions button {
        min-height: 42px;
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--text);
        font-size: 9px;
        text-transform: uppercase;
      }

      .receive-actions button:last-child {
        border-color: var(--green);
        background: var(--green);
        color: #050806;
      }

      .setting-stack {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 11px;
        padding: 13px;
      }

      .local-note {
        padding: 10px;
        border: 1px solid rgba(142, 233, 184, 0.38);
        color: var(--green);
        font-size: 9px;
        line-height: 1.5;
      }

      .setting-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        min-height: 43px;
        align-items: center;
        gap: 12px;
        padding: 0 10px;
        border: 1px solid var(--line);
        background: var(--panel);
      }

      .setting-row span:first-child {
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
      }

      .setting-row span:last-child {
        color: var(--text);
        font-size: 10px;
      }

      .network-card {
        padding: 11px;
      }

      .network-card strong,
      .network-card small {
        display: block;
        font-weight: 400;
      }

      .network-card strong {
        color: var(--text);
        font-size: 11px;
      }

      .network-card small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 8px;
      }

      .setting-add {
        min-height: 39px;
        border: 1px solid var(--green);
        background: transparent;
        color: var(--green);
        font-size: 9px;
        text-transform: uppercase;
      }

      .promo {
        display: flex;
        align-items: center;
        overflow: hidden;
        background-color: #050806;
      }

      .promo-bg {
        position: absolute;
        inset: 0;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.55;
      }

      .promo::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        background: linear-gradient(90deg, rgba(5, 8, 6, 0.98) 8%, rgba(5, 8, 6, 0.72) 62%, rgba(5, 8, 6, 0.28));
      }

      .promo-small {
        gap: 20px;
        padding: 34px;
      }

      .promo-small .brand-logo {
        width: 84px;
        height: 84px;
        flex: 0 0 auto;
      }

      .promo-small h2,
      .promo-marquee h2 {
        margin: 0;
        color: var(--text);
        font-weight: 400;
      }

      .promo-small h2 {
        font-size: 35px;
        letter-spacing: -0.05em;
      }

      .promo-small p {
        margin: 9px 0 0;
        color: var(--green);
        font-size: 10px;
        letter-spacing: 0.09em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .promo-marquee {
        justify-content: space-between;
        gap: 70px;
        padding: 70px 92px;
      }

      .promo-marquee .promo-copy {
        max-width: 720px;
      }

      .promo-marquee .brand-row {
        margin-bottom: 48px;
      }

      .promo-marquee h2 {
        font-size: 72px;
        letter-spacing: -0.06em;
      }

      .promo-marquee p {
        max-width: 650px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.5;
      }

      .promo-marquee .mini-wallet {
        position: relative;
        width: 350px;
        height: 420px;
        overflow: hidden;
        border: 1px solid rgba(142, 233, 184, 0.5);
        background: var(--panel);
        box-shadow: 18px 18px 0 rgba(142, 233, 184, 0.06);
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1px;
        padding: 1px;
        background: var(--line-strong);
      }

      .mini-cell {
        min-height: 84px;
        padding: 14px;
        background: var(--bg);
      }

      .mini-cell small,
      .mini-cell strong {
        display: block;
        font-weight: 400;
      }

      .mini-cell small {
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
      }

      .mini-cell strong {
        margin-top: 13px;
        color: var(--green);
        font-size: 16px;
      }
    </style>
    <script type="module" crossorigin src="/assets/showcase-BUwtWhr_.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
