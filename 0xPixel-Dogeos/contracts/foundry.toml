[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.34"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../node_modules/@openzeppelin/contracts"]
[fuzz]
runs = 512
[invariant]
runs = 64
depth = 96
fail_on_revert = true
