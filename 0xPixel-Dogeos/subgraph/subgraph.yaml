specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: DogeosPixel
    network: dogeos-testnet
    source:
      address: '0x5f99636850e62d41e03b29ba53b5dc285d4ceab8'
      abi: DogeosPixel
      startBlock: 8204635
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Pixel, Collection, Listing, Offer, Sale, Activity, Account, Stats, MarketApproval]
      abis:
        - name: DogeosPixel
          file: ./abis/DogeosPixel.json
        - name: PixelMarket
          file: ./abis/PixelMarket.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
        - event: Minted(indexed address,indexed uint256,string)
          handler: handleMinted
        - event: CollectionCreated(indexed uint256,indexed address,string,string)
          handler: handleCollectionCreated
        - event: CollectionUpdated(indexed uint256,string,string)
          handler: handleCollectionUpdated
        - event: TokenCollectionChanged(indexed uint256,indexed uint256,indexed uint256)
          handler: handleTokenCollectionChanged
      file: ./src/pixel.ts
  - kind: ethereum/contract
    name: PixelMarket
    network: dogeos-testnet
    source:
      address: '0xc1f82f63ee635154e5655afe2fcba4a5e85b1e6b'
      abi: PixelMarket
      startBlock: 8204637
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Pixel, Collection, Listing, Offer, Sale, Activity, Account, Stats, MarketApproval]
      abis:
        - name: DogeosPixel
          file: ./abis/DogeosPixel.json
        - name: PixelMarket
          file: ./abis/PixelMarket.json
      eventHandlers:
        - event: Listed(indexed uint256,indexed address,indexed uint256,uint256,uint64,uint256)
          handler: handleListed
        - event: ListingCancelled(indexed uint256,indexed uint256)
          handler: handleListingCancelled
        - event: Sold(indexed uint256,indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handleSold
        - event: OfferMade(indexed uint256,indexed uint256,indexed address,uint256,uint64)
          handler: handleOfferMade
        - event: OfferCancelled(indexed uint256)
          handler: handleOfferCancelled
        - event: OfferAccepted(indexed uint256,indexed uint256,indexed address,address,uint256,uint256,uint256)
          handler: handleOfferAccepted
        - event: Withdrawn(indexed address,indexed address,uint256)
          handler: handleWithdrawn
      file: ./src/market.ts
